jwt:
  secret: ${JWT_SECRET:reactive-training-jwt-secret-key-must-be-long-enough-for-hs256-algorithm}
  expiration-ms: 86400000

spring:
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_R2DBC_USERNAME:postgres}
    password: ${SPRING_R2DBC_PASSWORD:p}
  application:
    name: reactive-training
  threads:
    virtual:
      enabled: true

resilience4j:
  timelimiter:
    configs:
      defaultTimeLimitingConfig:
        timeoutDuration: 2s
        cancelRunningFuture: true
    instances:
      createBookTimeout:
        baseConfig: defaultTimeLimitingConfig
        timeoutDuration: 2s
      getBookByIdTimeout:
        baseConfig: defaultTimeLimitingConfig
        timeoutDuration: 1s
      getAllBooksTimeout:
        baseConfig: defaultTimeLimitingConfig
        timeoutDuration: 3s
      updateBookTimeout:
        baseConfig: defaultTimeLimitingConfig
        timeoutDuration: 2s
      deleteBookByIdTimeout:
        baseConfig: defaultTimeLimitingConfig
        timeoutDuration: 1s
      createAuthorTimeout:
        baseConfig: defaultTimeLimitingConfig
        timeoutDuration: 2s
      getAuthorByIdTimeout:
        baseConfig: defaultTimeLimitingConfig
        timeoutDuration: 1s
      getAllAuthorsTimeout:
        baseConfig: defaultTimeLimitingConfig
        timeoutDuration: 3s
      updateAuthorTimeout:
        baseConfig: defaultTimeLimitingConfig
        timeoutDuration: 2s
      deleteAuthorByIdTimeout:
        baseConfig: defaultTimeLimitingConfig
        timeoutDuration: 1s
  ratelimiter:
    configs:
      defaultRateLimitingConfig:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0ms
    instances:
      createBookRateLimit:
        baseConfig: defaultRateLimitingConfig
      getAllBooksRateLimit:
        baseConfig: defaultRateLimitingConfig
      getBookByIdRateLimit:
        baseConfig: defaultRateLimitingConfig
      updateBookRateLimit:
        baseConfig: defaultRateLimitingConfig
      deleteBookByIdRateLimit:
        baseConfig: defaultRateLimitingConfig
      createAuthorRateLimit:
        baseConfig: defaultRateLimitingConfig
      getAllAuthorsRateLimit:
        baseConfig: defaultRateLimitingConfig
      getAuthorByIdRateLimit:
        baseConfig: defaultRateLimitingConfig
      updateAuthorRateLimit:
        baseConfig: defaultRateLimitingConfig
      deleteAuthorByIdRateLimit:
        baseConfig: defaultRateLimitingConfig
