# ===================================================================
# Common predicates (referencing Jakarta Bean Validation standard keys)
# ===================================================================
common.NotNull.message={jakarta.validation.constraints.NotNull.message}
common.NotEmpty.message={jakarta.validation.constraints.NotEmpty.message}
common.NotBlank.message={jakarta.validation.constraints.NotBlank.message}
common.Size.max.message=must not exceed {max} characters
common.PositiveOrZero.message=must be zero or positive

# ===================================================================
# Common field messages
# ===================================================================
common.id.NotNull.message=id {common.NotNull.message}

# ===================================================================
# Author messages
# ===================================================================
author.name.NotBlank.message=name {common.NotBlank.message}
author.name.Size.message=name {common.Size.max.message}

# ===================================================================
# Book messages
# ===================================================================
book.isbn.NotNull.message=isbn {common.NotNull.message}
book.isbn.NotEmpty.message=isbn {common.NotEmpty.message}
book.isbn.Size.message=isbn {common.Size.max.message}

book.title.NotNull.message=title {common.NotNull.message}
book.title.NotEmpty.message=title {common.NotEmpty.message}
book.title.Size.message=title {common.Size.max.message}

book.availableCopies.PositiveOrZero.message=availableCopies {common.PositiveOrZero.message}
book.genre.NotNull.message=genre {common.NotNull.message}
book.authorId.NotNull.message=authorId {common.NotNull.message}

# ===================================================================
# Login messages
# ===================================================================
login.username.NotEmpty.message=username {common.NotEmpty.message}
login.password.NotEmpty.message=password {common.NotEmpty.message}
