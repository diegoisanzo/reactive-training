plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.protobuf' version '0.10.0'
}

group = 'ar.training'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

ext {
	jjwtVersion         = '0.12.6'
	mapstructVersion    = '1.6.3'
	resilience4jVersion = '2.4.0'
}

repositories {
	mavenCentral()
//	maven { url = 'https://repo.spring.io/snapshot' }
}

dependencies {
	implementation platform("org.springframework.grpc:spring-grpc-dependencies:1.1.1")

	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-r2dbc'
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-grpc-server'
	implementation 'io.grpc:grpc-services'
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	implementation "io.github.resilience4j:resilience4j-spring-boot4:${resilience4jVersion}"
	implementation "io.github.resilience4j:resilience4j-reactor:${resilience4jVersion}"
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"

	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
	annotationProcessor 'de.firehead:mapstruct-spi-protobuf:1.1.0'

	// PostgreSQL R2DBC driver — required for reactive database connectivity
	runtimeOnly 'org.postgresql:r2dbc-postgresql'

	// jwt
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-r2dbc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-r2dbc'
	testImplementation 'org.springframework.boot:spring-boot-starter-grpc-server-test'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// covers current test task and any future test tasks (e.g. integrationTest)
tasks.withType(Test).configureEach {
	jvmArgs '-XX:+EnableDynamicAgentLoading'
}

protobuf {
	// Configures the official Protocol Buffers compiler version
	protoc {
		artifact = 'com.google.protobuf:protoc:3.25.9'
	}
	// Registers the gRPC Java code generation plugin
	plugins {
		grpc {
			artifact = 'io.grpc:protoc-gen-grpc-java:1.85.1'
		}
	}
	// Applies the gRPC plugin to all proto compilation tasks across every source set
	generateProtoTasks {
		all().each { task ->
			task.plugins {
				grpc {}
			}
		}
	}
}
